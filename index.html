function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function order(a){return shuf(a).sort(function(x,y){return box(x)-box(y)})}
function sm(m){return m.split(/\s*\((Khác|Đồng)/)[0].replace(/\n?•\s*/g,' ').trim()}

function hl(e,a){if(!a)return esc(e);var k=e.toLowerCase().indexOf(a.toLowerCase());return k<0?esc(e):esc(e.slice(0,k))+'<mark>'+esc(e.slice(k,k+a.length))+'</mark>'+esc(e.slice(k+a.length))}
function nav(){
 $('#secs').innerHTML=SEC.map(function(s){return '<button class="chip'+(S.sec===s[0]?' on':'')+'" data-sec="'+s[0]+'">'+s[1]+'</button>'}).join('');
 $('#modes').innerHTML=MODES.map(function(m){return '<button class="chip'+(S.mode===m[0]?' on':'')+'" data-mode="'+m[0]+'">'+m[1]+'</button>'}).join('')+'<button class="chip" data-reset="1" style="margin-left:auto">↺ Xóa tiến độ</button>'}
function stats(){var p=pool(),all=DATA.filter(function(i){return S.sec==='all'||i.s===S.sec||S.sec==='due'}),k=all.filter(function(i){return box(i)>=2}).length;
 $('#pb').style.width=(all.length?100*k/all.length:0)+'%';$('#pt').textContent='Đã thuộc '+k+'/'+all.length+' mục · bấm “Đã thuộc” hoặc trả lời đúng 2 lần để tính là thuộc'}
function go(){nav();stats();R={};var p=pool();if(!p.length){$('#stage').innerHTML='<div class="card"><div class="big">🎉</div><p style="text-align:center">Không còn mục nào cần ôn trong nhóm này. Giỏi quá!</p></div>';return}
 ({card:card,mc:mc,fill:fill,list:list})[S.mode](p)}
// ---- thẻ
function card(p){R.d=order(p);R.i=0;R.f=false;drawCard()}
function drawCard(){var d=R.d,i=d[R.i];if(!i){$('#stage').innerHTML='<div class="card" style="text-align:center"><div class="big">🌈</div><p>Hết một vòng ('+d.length+' thẻ)!</p><button class="btn" data-a="again">Học lại vòng mới</button></div>';return}
 var back=i.s==='form'?'<div><b>Dạng phái sinh</b><div class="x" style="color:var(--tx)">'+esc(i.m)+'</div></div><div class="x">'+esc(i.x)+'</div>':'<div>'+esc(i.m)+'</div><div class="x">'+esc(i.x)+'</div>';
 $('#stage').innerHTML='<small>Thẻ '+(R.i+1)+'/'+d.length+'</small><div class="fc"><div class="in" data-a="flip"><button class="spk" data-a="say" title="Nghe phát âm">🔊</button>'+
 (R.f?'<div class="back">'+back+'<div class="ex">'+hl(i.e,i.a)+'</div></div>':'<div class="term">'+esc(i.t)+(i.p?'<span class="pos">('+esc(i.p)+')</span>':'')+'</div>')+
 '<div class="hint">'+(R.f?'':'Bấm vào thẻ để xem nghĩa')+'</div></div></div><div class="row" style="justify-content:center"><button class="btn d" data-a="no">🔁 Chưa thuộc</button><button class="btn" data-a="yes">✓ Đã thuộc</button></div>'}
// ---- trắc nghiệm
function mc(p){p=p.filter(function(i){return i.s!=='form'});if(p.length<2){$('#stage').innerHTML='<div class="card">Nhóm này cần chuyển sang chế độ <b>Điền từ</b> hoặc <b>Thẻ</b> nhé.</div>';return}
 R.q=order(p).slice(0,10);R.i=0;R.ok=0;R.bad=[];R.all=DATA.filter(function(i){return i.s!=='form'});drawMc()}
function drawMc(){var i=R.q[R.i];if(!i)return done();var o=shuf(shuf(R.all.filter(function(x){return x.t!==i.t})).slice(0,3).concat(i));R.cur=i;R.ans=false;
 $('#stage').innerHTML='<div class="card"><small>Câu '+(R.i+1)+'/'+R.q.length+' · Đúng '+R.ok+'</small><div class="q">“'+esc(sm(i.m))+'”<br><small>Chọn từ/cụm đúng:</small></div>'+o.map(function(x){return '<button class="opt" data-a="opt" data-t="'+esc(x.t)+'">'+esc(x.t)+'</button>'}).join('')+'<div id="fb"></div></div>'}
// ---- điền từ
function fill(p){p=p.filter(function(i){return i.a});R.q=order(p).slice(0,10);R.i=0;R.ok=0;R.bad=[];drawFill()}
function blank(i){var k=i.e.toLowerCase().indexOf(i.a.toLowerCase());return esc(i.e.slice(0,k))+'<b>＿＿＿＿＿＿</b>'+esc(i.e.slice(k+i.a.length))}
function drawFill(){var i=R.q[R.i];if(!i)return done();R.cur=i;R.ans=false;
 $('#stage').innerHTML='<div class="card"><small>Câu '+(R.i+1)+'/'+R.q.length+' · Đúng '+R.ok+'</small><div class="q">'+blank(i)+'</div><p class="mu" style="margin:0 0 10px">Gợi ý: '+esc(sm(i.s==='form'?i.x.split('\n')[0].replace('• ',''):i.m))+' · bắt đầu bằng “'+esc(i.a[0])+'”'+(i.s==='form'?' · từ gốc: <b>'+esc(i.t)+'</b>':'')+'</p><input class="ans" id="in" autocomplete="off" autocapitalize="none" placeholder="Gõ đáp án rồi Enter"><div class="row" style="margin-top:10px"><button class="btn" data-a="chk">Kiểm tra</button><button class="btn g" data-a="skip">Bỏ qua</button></div><div id="fb"></div></div>';$('#in').focus()}
function result(ok,i){R.ans=true;if(ok)R.ok++;else R.bad.push(i);bump(i,ok);
 $('#fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✓ Chính xác! ':'✗ Đáp án: <b>'+esc(i.a||i.t)+'</b>. ')+'<div style="margin-top:4px;font-style:italic">'+hl(i.e,i.a)+'</div></div><div class="row" style="margin-top:10px"><button class="btn" data-a="next">Câu tiếp →</button><button class="btn g" data-a="say">🔊 Nghe</button></div>'}
function done(){var n=R.q.length,b=R.bad.length;$('#stage').innerHTML='<div class="card" style="text-align:center"><div class="big">'+R.ok+'/'+n+'</div><p>'+(R.ok===n?'Tuyệt vời, đúng hết! 🌟':R.ok>=n*.7?'Khá lắm, gần thuộc rồi! 🌿':'Cố lên, ôn lại thêm nhé 🍃')+'</p>'+(b?'<p class="mu">Cần ôn lại: <b>'+R.bad.map(function(x){return esc(x.t)}).join(', ')+'</b></p>':'')+'<div class="row" style="justify-content:center"><button class="btn" data-a="again">Làm bộ mới</button>'+(b?'<button class="btn g" data-a="redo">Làm lại câu sai</button>':'')+'</div></div>'}
// ---- danh sách
function list(p){$('#stage').innerHTML='<div class="card"><input class="s" id="ls" placeholder="Tìm từ hoặc nghĩa…"><div id="lb"></div></div>';drawList('')}
function drawList(q){q=q.toLowerCase();$('#lb').innerHTML=pool().filter(function(i){return !q||(i.t+' '+i.m+' '+i.x).toLowerCase().indexOf(q)>=0}).map(function(i){return '<details><summary><b>'+esc(i.t)+'</b>'+(i.p?' <span class="pos">('+esc(i.p)+')</span>':'')+' <span class="mu">— '+esc(i.s==='form'?i.x.split('\n')[0].replace('• ',''):sm(i.m))+'</span></summary><div class="back"><div style="white-space:pre-line">'+esc(i.m)+'</div><div class="x">'+esc(i.x)+'</div><div class="ex">'+hl(i.e,i.a)+'</div><button class="chip" data-a="say2" data-t="'+esc(i.t)+'" style="margin-top:8px">🔊 Nghe</button></div></details>'}).join('')||'<small>Không tìm thấy.</small>'}

// Bắt sự kiện khi người dùng chuyển Unit trong menu thả xuống
document.getElementById('unitBox').addEventListener('change', function(e) {
    currentUnit = e.target.value;           
    DATA = ALL_UNITS[currentUnit] || [];    
    loadProgress();                         
    S.sec = 'all';                          
    go();                                   
});

document.addEventListener('click',function(e){var b=e.target.closest('button,[data-a]');if(!b)return;var d=b.dataset;
 if(d.sec){S.sec=d.sec;go();return}if(d.mode){S.mode=d.mode;go();return}
 if(d.reset){if(confirm('Xóa toàn bộ tiến độ đã học?')){P={};sv();go()}return}
 var a=d.a,i=R.d?R.d[R.i]:R.cur;
 if(a==='flip'){if(e.target.closest('.spk')){say(i.t);return}R.f=!R.f;drawCard()}
 else if(a==='say'){e.stopPropagation();say(i.t)}else if(a==='say2')say(d.t)
 else if(a==='yes'||a==='no'){bump(i,a==='yes');R.i++;R.f=false;drawCard()}
 else if(a==='again')go();
 else if(a==='redo'){R.q=shuf(R.bad);R.bad=[];R.i=0;R.ok=0;S.mode==='mc'?drawMc():drawFill()}
 else if(a==='opt'&&!R.ans){var ok=d.t===i.t;b.classList.add(ok?'ok':'no');document.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(x.dataset.t===i.t)x.classList.add('ok')});result(ok,i)}
 else if(a==='chk'&&!R.ans){var v=norm($('#in').value);if(!v)return;$('#in').disabled=true;result(v===norm(i.a)||v===norm(i.t.split('/')[0].replace(/\(.*?\)|\bsth\b|\bsb\b/g,'')),i)}
 else if(a==='skip'&&!R.ans){$('#in').disabled=true;result(false,i)}
 else if(a==='next'){R.i++;S.mode==='mc'?drawMc():drawFill()}});
document.addEventListener('input',function(e){if(e.target.id==='ls')drawList(e.target.value)});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='in'){e.preventDefault();var c=document.querySelector('[data-a=chk]');if(c)c.click()}
 else if(e.key==='Enter'&&R.ans){var n=document.querySelector('[data-a=next]');if(n)n.click()}
 else if(S.mode==='card'&&!/INPUT|TEXTAREA/.test(e.target.tagName)){if(e.key===' '){e.preventDefault();R.f=!R.f;drawCard()}else if(e.key==='ArrowRight'){var y=document.querySelector('[data-a=yes]');if(y)y.click()}else if(e.key==='ArrowLeft'){var n2=document.querySelector('[data-a=no]');if(n2)n2.click()}}});
$('#th').onclick=function(){var r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
// ---- hình nền
var hills=function(a,b,c,d,x){return (x||'')+'radial-gradient(120% 38% at 20% 100%,'+b+' 60%,transparent 61%),radial-gradient(110% 44% at 85% 100%,'+a+' 60%,transparent 61%),linear-gradient('+c+','+d+' 70%)'};
var dots=function(c,list){return list.map(function(p){return 'radial-gradient('+p[2]+'px '+p[2]+'px at '+p[0]+'% '+p[1]+'%,'+c+',transparent)'}).join(',')+','};
var BG=[['meadow','Đồng cỏ',''],
 ['sunset','Hoàng hôn',hills('#7a4b8c','#4d2f6b','#ff8a65','#ffe0a8')],
 ['night','Đêm sao',hills('#1f3a5a','#142a45','#0b1230','#2a3b6e',dots('#fff',[[12,18,2],[30,8,1.5],[55,22,2],[75,12,1.5],[90,28,2],[42,35,1.5],[20,40,1.5],[65,40,2]]))],
 ['forest','Rừng xanh',hills('#4f9e5a','#2f6f45','#2f6f55','#bfe3c8')],
 ['sakura','Hoa anh đào',hills('#f4a3b8','#e57fa0','#f48fb1','#ffe3ee',dots('#fff7',[[10,20,5],[28,35,4],[48,12,5],[66,30,4],[85,16,5],[92,45,4],[38,55,4]]))],
 ['sea','Biển',hills('#2aa6b8','#16869c','#6ec6ea','#e0f7fa')]];
function setBg(k,d){var b=document.body.style;b.backgroundSize='';b.backgroundPosition='';b.backgroundRepeat='';
 if(k==='img'&&d){b.backgroundImage='linear-gradient(rgba(10,30,20,.18),rgba(10,30,20,.18)),url('+d+')';b.backgroundSize='cover';b.backgroundPosition='center';b.backgroundRepeat='no-repeat'}
 else{var p=BG.filter(function(x){return x[0]===k})[0];b.backgroundImage=p?p[2]:''}
 document.querySelectorAll('#sw button').forEach(function(x){x.classList.toggle('on',x.dataset.k===k)})}
function pickBg(k,d){setBg(k,d);try{localStorage.setItem('vocab_bg',JSON.stringify({k:k,d:d||null}))}catch(e){$('#bgm').textContent='Ảnh hơi lớn nên chưa lưu được, chỉ dùng trong lần mở này.'}}
$('#sw').innerHTML=BG.map(function(p){return '<button data-k="'+p[0]+'" style="background-image:'+(p[2]||'linear-gradient(#5aa5df,#cfeaf4 55%,#3f8a52 56%)')+'">'+p[1]+'</button>'}).join('');
$('#sw').onclick=function(e){var b=e.target.closest('button');if(b)pickBg(b.dataset.k)};
$('#bgb').onclick=function(e){e.stopPropagation();$('#bgp').classList.toggle('show')};
document.addEventListener('click',function(e){if(!e.target.closest('#bgp,#bgb'))$('#bgp').classList.remove('show')});
$('#bgup').onclick=function(){$('#bgf').click()};
$('#bgf').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=1600,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);pickBg('img',c.toDataURL('image/jpeg',.82))};im.onerror=function(){$('#bgm').textContent='Không đọc được ảnh này, thử ảnh JPG/PNG khác nhé.'};im.src=r.result};r.readAsDataURL(f)};
try{var sb=JSON.parse(localStorage.getItem('vocab_bg')||'null');setBg(sb?sb.k:'meadow',sb&&sb.d)}catch(e){setBg('meadow')}
go();
</script></body></html>
